name: AI Issue Triage

on:
    issues:
        types: [opened, reopened]
    issue_comment:
        types: [created]
    workflow_dispatch:
        inputs:
            issue_number:
                description: Issue number to triage
                required: true
                type: number

permissions:
    contents: read
    issues: write
    models: read

concurrency:
    group: ai-triage-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
    cancel-in-progress: true

jobs:
    triage:
        if: github.event_name != 'issue_comment' || github.event.issue.pull_request == null
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Analyze and triage issue
              uses: actions/github-script@v8
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_TRIAGE_MODEL: ${{ vars.GITHUB_TRIAGE_MODEL || 'openai/gpt-4.1-mini' }}
                  MAINTAINER: DarkPhilosophy
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const { pathToFileURL } = require('node:url');
                      const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/triage-issue.mjs`;
                      const module = await import(pathToFileURL(scriptPath).href);
                      await module.default({ github, context, core });
