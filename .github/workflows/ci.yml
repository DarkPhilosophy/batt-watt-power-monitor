name: Extension CI

on:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    validate:
        name: Validate & Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
                  cache-dependency-path: package-lock.json

            - name: Install system dependencies
              run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin gjs gir1.2-upowerglib-1.0

            - name: Install dependencies
              run: npm install

            - name: Lint JavaScript
              run: npm run lint

            - name: Validate Schemas
              run: glib-compile-schemas --strict --dry-run extension/schemas/

            - name: Run unit tests
              run: npm test

            - name: Run GJS tests
              run: npm run test:gjs

            - name: Run validation gate
              run: npm run validate

            - name: Validate Metadata Template
              run: |
                  node -e "
                    const fs = require('fs');
                    const content = fs.readFileSync('extension/metadata.json', 'utf8');
                    const meta = JSON.parse(content);
                    const required = ['name', 'description', 'uuid', 'shell-version'];
                    for (const field of required) {
                      if (!meta[field]) {
                        console.error(\`Error: Missing required field '\${field}'\`);
                        process.exit(1);
                      }
                    }
                    console.log('Metadata template looks good! ✅');
                  "

    package:
        name: Build Package
        runs-on: ubuntu-latest
        needs: validate
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm install

            - name: Sync Version
              run: node .scripts/sync-version.mjs

            - name: Fetch GNOME Extensions Version
              run: node .scripts/fetch-ego-version.mjs

            - name: Lint JavaScript (for status)
              run: |
                  set -o pipefail
                  if npm run lint | tee .lint-output.txt; then
                    echo true > .lint-passed
                  else
                    echo false > .lint-passed
                    exit 1
                  fi

            - name: Update Lint Status
              run: npm run lint:status

            - name: Install system dependencies
              run: sudo apt-get update && sudo apt-get install -y python3-venv zip unzip

            - name: Provision SHEXLI
              run: python3 -m venv venv && venv/bin/pip install --quiet shexli==0.2.1 tree-sitter==0.25.2

            - name: Build Extension Package
              run: SHEXLI_AUTO_UPDATE=0 ./package.sh

            - name: Commit Changes
              if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
              run: |
                  git config --global user.name 'DarkPhilosophy'
                  git config --global user.email '19309990+DarkPhilosophy@users.noreply.github.com'
                  if [[ -n $(git status --porcelain) ]]; then
                    target_ref='${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}'
                    git add .
                    git commit -m "chore: Sync version, badges, and lint status [skip ci]"
                    git push origin "HEAD:${target_ref}"
                  else
                    echo "No changes to commit"
                  fi

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: extension-package
                  path: batt-watt-power-monitor@DarkPhilosophy.zip


            - name: Publish GitHub release
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  version=$(< VERSION)
                  tag="v${version}"
                  package="batt-watt-power-monitor@DarkPhilosophy.zip"
                  notes="$RUNNER_TEMP/release-notes.md"
                  node .scripts/release-notes.mjs "$version" > "$notes"
                  if gh release view "$tag" >/dev/null 2>&1; then
                    gh release edit "$tag" \
                      --title "Batt-Watt Power Monitor $tag" \
                      --notes-file "$notes" \
                      --latest
                  else
                    gh release create "$tag" "$package" \
                      --target "$(git rev-parse HEAD)" \
                      --title "Batt-Watt Power Monitor $tag" \
                      --notes-file "$notes" \
                      --latest
                  fi